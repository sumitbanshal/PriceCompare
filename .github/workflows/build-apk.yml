name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PriceCompare.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PriceCompare-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Built from ${{ github.sha }}. Download PriceCompare.apk on your phone and open it to install.
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/PriceCompare.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
